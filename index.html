<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>İLKNUR BAG</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:#0f0f0f;
    color:white;
    overflow-x:hidden;
}

header{
    position:fixed;
    width:100%;
    top:0;
    z-index:1000;
    backdrop-filter:blur(15px);
    background:rgba(0,0,0,.4);
    padding:20px 10%;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:28px;
    font-weight:700;
    color:#d4af37;
}

nav a{
    color:white;
    text-decoration:none;
    margin-left:25px;
    transition:.3s;
}

nav a:hover{
    color:#d4af37;
}

.hero{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:50px;
    background:
    linear-gradient(rgba(0,0,0,.6),rgba(0,0,0,.6)),
    url('https://nexoracreative.com/wp-content/uploads/2024/11/geny3-1920x1080.webp') center/cover;
}

.hero-content{
    animation:fadeUp 1.5s ease;
}

.hero h1{
    font-size:70px;
    margin-bottom:20px;
}

.hero p{
    font-size:20px;
    color:#ddd;
}

.btn{
    display:inline-block;
    margin-top:30px;
    padding:15px 35px;
    background:#d4af37;
    color:black;
    text-decoration:none;
    border-radius:50px;
    font-weight:600;
    transition:.3s;
}

.btn:hover{
    transform:translateY(-5px);
}

.products{
    padding:120px 10%;
}

.section-title{
    text-align:center;
    font-size:42px;
    margin-bottom:60px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
    gap:30px;
}

.card{
    background:#1a1a1a;
    border-radius:20px;
    overflow:hidden;
    transition:.4s;
}

.card:hover{
    transform:translateY(-15px);
    box-shadow:0 20px 40px rgba(212,175,55,.3);
}

.card img{
    width:100%;
    height:350px;
    object-fit:cover;
}

.card-content{
    padding:20px;
}

.card h3{
    margin-bottom:10px;
}

.price{
    color:#d4af37;
    font-size:22px;
    font-weight:700;
}

footer{
    text-align:center;
    padding:40px;
    background:#090909;
}

@keyframes fadeUp{
    from{
        opacity:0;
        transform:translateY(50px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.reveal{
    opacity:0;
    transform:translateY(50px);
    transition:1s;
}

.reveal.active{
    opacity:1;
    transform:translateY(0);
}

</style>
</head>

<body>

<header>
    <div class="logo">İLKNUR BAG</div>

    <nav>
        <a href="#">Ana Sayfa</a>
        <a href="#">Ürünler</a>
        <a href="#">Hakkımızda</a>
        <a href="#">İletişim</a>
    </nav>
</header>

<section class="hero">
    <div class="hero-content">
        <h1>Tarzını Taşı</h1>
        <p>Premium çantalar ile şıklığı yeniden keşfet.</p>
        <a href="#" class="btn">Koleksiyonu İncele</a>
    </div>
</section>

<section class="products reveal">
    <h2 class="section-title">Öne Çıkan Çantalar</h2>

    <div class="grid">

        <div class="card">
            <img src="https://images.unsplash.com/photo-1584917865442-de89df76afd3">
            <div class="card-content">
                <h3>Luxury Black Bag</h3>
                <div class="price">₺2.999</div>
            </div>
        </div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1591561954557-26941169b49e">
            <div class="card-content">
                <h3>Classic Leather</h3>
                <div class="price">₺3.499</div>
            </div>
        </div>

        <div class="card">
            <img src="https://images.unsplash.com/photo-1548036328-c9fa89d128fa">
            <div class="card-content">
                <h3>Golden Edition</h3>
                <div class="price">₺4.299</div>
            </div>
        </div>

    </div>
</section>

<footer>
    © 2026 Elegance Bags | Tüm Hakları Saklıdır
</footer>

<script>

window.addEventListener("scroll",()=>{

document.querySelectorAll(".reveal").forEach(el=>{

let top=el.getBoundingClientRect().top;

if(top<window.innerHeight-100){
el.classList.add("active");
}

});

});

</script>

</body>
</html>
